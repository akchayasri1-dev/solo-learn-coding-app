<!DOCTYPE html>
<html>
<head>
    <title>SoloLearn Coding App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Blurred background */
        body::before {
            content: "";
            position: fixed;
            inset: -10px;
            background-image: url("image.jpeg");
            background-size: cover;
            background-position: center;
            filter: blur(6px) brightness(0.4);
            z-index: -2;
        }

        /* Dark overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 20, 0.3);
            z-index: -1;
        }

        /* Center all details */
        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        nav a {
            font-family: "Trebuchet MS", sans-serif;
            color: #FFD700;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #00FFFF;
        }

        /* Main heading */
        h1 {
            font-family: Georgia, serif;
            font-size: 45px;
            color: #FFD700;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 2px 2px 8px black;
            margin-bottom: 25px;
        }

        /* Welcome heading */
        h2 {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 27px;
            color: #00FFFF;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Quote */
        .quote {
            font-family: Georgia, serif;
            font-size: 23px;
            font-style: italic;
            color: #FFFFFF;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Description */
        p {
            font-family: "Trebuchet MS", sans-serif;
            font-size: 16px;
            color: #F0F0F0;
            line-height: 1.7;
            max-width: 450px;
            margin-bottom: 25px;
        }

        /* Button */
        button {
            padding: 14px 32px;
            background: #FFD700;
            color: #071b13;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00FFFF;
        }

        /* Bottom tagline */
        .tagline {
            font-family: Georgia, serif;
            font-size: 15px;
            color: #00FFFF;
            letter-spacing: 2px;
            margin-top: 25px;
        }

    </style>
</head>

<body >

    <div class="container">

        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="register.html">Register</a>
        </nav>

        <h1>SOLOLEARN</h1>

        <h2>Welcome to Coding World!</h2>

        <div class="quote">
            "Code Your Dreams,<br>
            Create Your Future."
        </div>

        <p>
            Start your coding journey today.
            Learn, practice and build your skills
            one line at a time.
        </p>

        <button onclick="location.href='about.html'">
            about us
        </button>

        <div class="tagline">
            LEARN • PRACTICE • CREATE
        </div>

    </div>

</body>
</html>
